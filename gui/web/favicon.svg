<!-- Icone d'onglet — GENEREE par packaging/make_logo.py, ne pas
     editer a la main. C'est la meme photographie que l'en-tete du
     Dashboard, embarquee en data URI pour que le fichier soit
     autonome : un SVG qui pointerait vers un fichier voisin ne charge
     pas de maniere fiable quand il sert de favicon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="64" height="64">
  <clipPath id="c"><rect width="240" height="240" rx="52"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="240" height="240" fill="#08050a"/>
    <image x="0" y="0" width="240" height="240" href="data:image/webp;base64,"/>
  </g>
</svg>
