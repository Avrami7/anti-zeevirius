<!-- Icône d'onglet. Elle reprend TRAIT POUR TRAIT la géométrie du symbole
     `blackhole` de index.html (même viewBox 240, mêmes coordonnées) : une
     marque qui diverge entre l'onglet et l'en-tête n'est plus une marque.
     Seuls diffèrent le fond arrondi — un favicon est vu sur fond de barre
     d'onglets, clair ou sombre, et doit porter le sien — et l'absence des
     tracés d'animation, inutiles sur une image statique de 16 pixels. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="64" height="64">
  <defs>
    <radialGradient id="fHalo" cx="50%" cy="54%" r="52%">
      <stop offset="0%"   stop-color="#ffb257" stop-opacity=".34"/>
      <stop offset="30%"  stop-color="#ff7a17" stop-opacity=".22"/>
      <stop offset="62%"  stop-color="#c2410c" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#7a2408" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fWing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b8420c" stop-opacity=".55"/>
      <stop offset="16%"  stop-color="#f08324" stop-opacity=".92"/>
      <stop offset="38%"  stop-color="#ffd79a" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#fffdf6" stop-opacity="1"/>
      <stop offset="62%"  stop-color="#ffd79a" stop-opacity="1"/>
      <stop offset="84%"  stop-color="#ef7f20" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#a8380a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="fArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a8380a" stop-opacity=".45"/>
      <stop offset="20%"  stop-color="#f4902c" stop-opacity=".92"/>
      <stop offset="50%"  stop-color="#fff6e2" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#f08324" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#a8380a" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="fBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffcf92" stop-opacity=".75"/>
      <stop offset="28%"  stop-color="#fffefb" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#fffdf6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffcf92" stop-opacity=".75"/>
    </linearGradient>
    <clipPath id="fSphere"><circle cx="120" cy="118" r="44"/></clipPath>
    <filter id="fSoft" x="-45%" y="-160%" width="190%" height="420%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="240" height="240" rx="52" fill="#08050a"/>
  <ellipse cx="120" cy="122" rx="119" ry="86" fill="url(#fHalo)"/>

  <path d="M5 135.5 C 42 120, 76 122, 105 129 L 135 129 C 164 122, 198 120, 235 135.5
           C 198 142, 164 138, 135 133 L 105 133 C 76 138, 42 142, 5 135.5 Z"
        fill="url(#fWing)"/>
  <path d="M26 132 A 96 62 0 0 1 214 132" fill="none" stroke="url(#fArc)"
        stroke-width="13" stroke-linecap="round" filter="url(#fSoft)"/>
  <path d="M26 132 A 96 62 0 0 1 214 132" fill="none" stroke="#fff8e8"
        stroke-width="2.4" stroke-linecap="round" opacity=".5"/>

  <circle cx="120" cy="118" r="44" fill="#000000"/>
  <g clip-path="url(#fSphere)">
    <path d="M48 126 Q 120 140, 192 126" fill="none" stroke="url(#fBand)"
          stroke-width="19" opacity=".4" filter="url(#fSoft)"/>
    <path d="M48 126 Q 120 140, 192 126" fill="none" stroke="url(#fBand)"
          stroke-width="9" opacity=".92" filter="url(#fSoft)"/>
    <path d="M48 126 Q 120 140, 192 126" fill="none" stroke="#fffefa"
          stroke-width="3.4" opacity=".95"/>
  </g>
  <circle cx="120" cy="118" r="44.5" fill="none" stroke="#ffcf92"
          stroke-width=".9" opacity=".3"/>
</svg>
