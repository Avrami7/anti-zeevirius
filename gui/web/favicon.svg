<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb257" stop-opacity=".48"/>
      <stop offset="55%" stop-color="#ff7a17" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#e04a05" stop-opacity="0"/>
    </radialGradient>
    <!-- Décalage Doppler : le côté gauche vient vers l'observateur, il est
         blanc-chaud ; le droit s'éloigne et s'assombrit. C'est cette
         asymétrie qui fait lire un trou noir plutôt qu'un anneau. -->
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd489"/>
      <stop offset="12%" stop-color="#fffdf6"/>
      <stop offset="30%" stop-color="#ffe7b0"/>
      <stop offset="52%" stop-color="#f7942a"/>
      <stop offset="78%" stop-color="#c9540e"/>
      <stop offset="100%" stop-color="#8a3a0c"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a24a" stop-opacity=".55"/>
      <stop offset="16%" stop-color="#fff6e2" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#f9a13c" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#8e3a0b" stop-opacity=".48"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#08050a"/>
  <circle cx="32" cy="32" r="30" fill="url(#h)"/>
  <!-- arrière du disque, relevé par la lentille gravitationnelle -->
  <path d="M6 34.5 A 26 16 0 0 1 58 34.5" fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="round"/>
  <!-- ombre : NOIR PUR, aucun dégradé (sinon elle ressemble à une planète) -->
  <circle cx="32" cy="32" r="13.5" fill="#000"/>
  <circle cx="32" cy="32" r="13.9" fill="none" stroke="#ffcf92" stroke-width=".6" opacity=".3"/>
  <!-- avant du disque : il passe DEVANT l'ombre -->
  <path d="M6 34.5 A 26 5 0 0 0 58 34.5" fill="none" stroke="url(#d)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M6 34.5 A 26 5 0 0 0 58 34.5" fill="none" stroke="#fffdf4" stroke-width="1" stroke-linecap="round" opacity=".45"/>
</svg>
